<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rocky · 16-bit animation pack</title>
<style>body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#18243b 0%,#070a15 50%,#020409 100%);color:#d8e7ec;font:16px system-ui;padding:32px;box-sizing:border-box}h1{font-size:1.8rem;font-weight:500;letter-spacing:.04em;text-align:center}p{text-align:center;color:#8aa2b9}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1120px;margin:35px auto}article{border:1px solid #2a3850;border-radius:14px;text-align:center;background:#0c1424;padding:16px}article img{width:min(100%,300px);height:auto;image-rendering:pixelated}article h2{font-size:1rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#9cc9d1}@media(prefers-reduced-motion:reduce){article img{animation:none}}</style></head>
<body><h1>Rocky · 16-bit motions</h1><p>Walking / Crawling / Jumping / Waving</p><main><article><img src="rocky-walking.webp" alt="Rocky walking"><h2>Walking</h2></article>
<article><img src="rocky-crawling.webp" alt="Rocky crawling"><h2>Crawling</h2></article>
<article><img src="rocky-jumping.webp" alt="Rocky jumping"><h2>Jumping</h2></article>
<article><img src="rocky-waving.webp" alt="Rocky waving"><h2>Waving</h2></article></main></body></html>
